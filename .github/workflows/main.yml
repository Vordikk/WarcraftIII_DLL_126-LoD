---
name: C/C++ CI
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
jobs:
  build_xp:
    name: WindowsXP
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: Win32
      - name: Build XP
        run: >
          msbuild DotAAllstarsHelper.sln -m /p:Configuration=Release
      - name: SIGNING
        run: |
          ./SignRelease.bat
      - name: PACK_IT_ALL
        run: >
          Compress-Archive -Path "Release/DotAAllstarsHelperFinal.dll" -DestinationPath "DotAAllstarsHelper.zip"
          
          Compress-Archive -Path "Release/DotAAllstarsHelperFinal.pdb" -DestinationPath "DotAAllstarsHelper.zip"
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish binaries for windows XP+
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          files: |
            DotAAllstarsHelper.zip
